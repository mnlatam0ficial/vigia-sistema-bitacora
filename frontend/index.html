<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Bitácora digital de accesos: registro y control de entradas y salidas en caseta de vigilancia.">
<title>Vigía · Control de Accesos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230F172A'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%2334D399'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
        },
        keyframes: {
          'fade-in-up': { '0%': { opacity: 0, transform: 'translateY(6px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          'toast-in':   { '0%': { opacity: 0, transform: 'translateY(12px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
        },
        animation: {
          'fade-in-up': 'fade-in-up .3s ease-out',
          'toast-in': 'toast-in .3s ease-out',
        },
      },
    },
  };
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.7); }
</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

  <!-- ============ HEADER ============ -->
  <header class="bg-slate-900 text-white sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="h-10 w-10 rounded-xl bg-white/10 border border-white/10 flex items-center justify-center shrink-0">
          <svg class="h-5 w-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="leading-tight min-w-0">
          <p class="font-bold text-[15px] sm:text-base">Vigía</p>
          <p class="text-[11px] text-slate-400 truncate hidden sm:block">Caseta Principal</p>
        </div>
      </div>
      <div class="flex items-center gap-4 sm:gap-6 shrink-0">
        <div class="hidden sm:flex items-center gap-1.5 text-xs text-slate-300">
          <span id="connection-dot" class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="connection-text">En línea</span>
        </div>
        <div class="text-right">
          <p id="clock-time" class="font-bold text-sm sm:text-base tabular-nums leading-tight">--:--:--</p>
          <p id="clock-date" class="text-[10px] sm:text-[11px] text-slate-400 capitalize leading-tight hidden sm:block">-</p>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 grid grid-cols-1 lg:grid-cols-5 gap-6 items-start">

    <!-- ---- Zona clara: formulario (la tarea activa) ---- -->
    <section class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 border-t-4 border-t-emerald-500 p-6 sm:p-8">
      <div class="mb-7">
        <h1 class="text-xl font-bold text-slate-900">Registrar Nuevo Acceso</h1>
        <p class="text-sm text-slate-500 mt-1">Completa los datos del vehículo para autorizar el ingreso.</p>
      </div>

      <form id="entry-form" class="space-y-5" novalidate>
        <!-- Placa -->
        <div>
          <label for="placa" class="block text-sm font-semibold text-slate-700 mb-1.5">Placa del vehículo</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 pointer-events-none">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/>
                <rect x="2" y="13" width="20" height="5" rx="1.5"/>
                <circle cx="7" cy="18.5" r="1.3"/>
                <circle cx="17" cy="18.5" r="1.3"/>
              </svg>
            </span>
            <input id="placa" name="placa" type="text" autocomplete="off" placeholder="ABC-1234"
              class="w-full h-14 pl-12 pr-4 rounded-xl border border-slate-300 bg-slate-50 font-mono text-lg font-bold tracking-widest text-slate-900 placeholder:font-sans placeholder:font-normal placeholder:tracking-normal placeholder:text-slate-400 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition">
          </div>
        </div>

        <!-- Visitante -->
        <div>
          <label for="visitante" class="block text-sm font-semibold text-slate-700 mb-1.5">Nombre del visitante o proveedor</label>
          <input id="visitante" name="visitante" type="text" placeholder="Ej. Juan Pérez"
            class="w-full h-14 px-4 rounded-xl border border-slate-300 bg-slate-50 text-base focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition">
        </div>

        <!-- Tipo + Destino -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label for="tipo" class="block text-sm font-semibold text-slate-700 mb-1.5">Motivo de la visita</label>
            <div class="relative">
              <select id="tipo" class="w-full h-14 pl-4 pr-11 rounded-xl border border-slate-300 bg-slate-50 text-base appearance-none cursor-pointer focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition">
                <option value="" selected>Selecciona una opción</option>
                <option value="Visita">Visita</option>
                <option value="Proveedor">Proveedor</option>
                <option value="Empleado">Empleado</option>
                <option value="Paquetería">Paquetería</option>
              </select>
              <span class="pointer-events-none absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </div>
          </div>
          <div>
            <label for="destino" class="block text-sm font-semibold text-slate-700 mb-1.5">Destino</label>
            <input id="destino" name="destino" type="text" placeholder="Casa 24, Bodega 3..."
              class="w-full h-14 px-4 rounded-xl border border-slate-300 bg-slate-50 text-base focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition">
          </div>
        </div>

        <button type="submit" class="w-full h-16 mt-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white text-lg font-bold shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2.5">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
          Registrar Entrada
        </button>
      </form>
    </section>

    <!-- ---- Zona oscura: tablero en vivo (estado del sistema) ---- -->
    <section class="lg:col-span-2 bg-slate-900 rounded-xl ring-1 ring-white/5 flex flex-col overflow-hidden">
      <div class="px-5 sm:px-6 py-5 border-b border-white/10 flex items-center justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-base font-bold text-white">Vehículos Adentro</h2>
          <p class="text-xs text-slate-400 mt-0.5">Salida Express</p>
        </div>
        <span id="active-count" class="h-7 min-w-[1.75rem] px-2 rounded-full bg-white/10 text-white text-xs font-bold flex items-center justify-center shrink-0">0</span>
      </div>

      <div id="vehicles-list" class="overflow-y-auto divide-y divide-white/10 max-h-[420px] lg:max-h-[560px]"></div>

      <div id="empty-state" class="hidden px-8 py-14 text-center">
        <svg class="mx-auto h-8 w-8 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>
        </svg>
        <p class="text-sm font-medium text-slate-400 mt-4">No hay vehículos registrados</p>
        <p class="text-xs text-slate-500 mt-1">Los ingresos aparecerán aquí</p>
      </div>
    </section>
  </main>

  <!-- ============ TOASTS ============ -->
  <div id="toast-container" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:bottom-6 z-50 flex flex-col gap-2 items-stretch sm:items-end pointer-events-none"></div>

<script>
  /* ============================================================
     Vigía · Bitácora Digital de Accesos — Fase 2 (Frontend)
     Ya conectado al backend de FastAPI: POST /api/entradas ·
     PUT /api/salidas/{id} · GET /api/vehiculos-activos.
     Cambia API_BASE por tu URL real en producción (Railway/Render/ngrok).
     ============================================================ */

  const API_BASE = 'http://localhost:8000';

  // Convierte las fechas UTC "naive" que manda el backend (sin sufijo Z) a
  // un Date correcto — si no, el navegador las lee como hora local y los
  // tiempos de "hace X min" salen mal (p.ej. 6h de diferencia en México).
  function parsearFechaUTC(iso) {
    if (!iso) return null;
    return new Date(/Z$|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + 'Z');
  }

  // ---------- Utilidades ----------
  function generarId() {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Texto + color según cuánto tiempo lleva el vehículo adentro.
  // Sirve para detectar de un vistazo sobre-estadías (gris -> ámbar -> rojo).
  function calcularUrgencia(fecha) {
    const minutos = Math.floor((Date.now() - fecha.getTime()) / 60000);
    const texto = minutos < 1 ? 'Recién ingresó'
      : minutos < 60 ? `Hace ${minutos} min`
      : `Hace ${Math.floor(minutos / 60)}h ${minutos % 60}min`;
    const color = minutos < 30 ? 'text-slate-400' : minutos < 90 ? 'text-amber-400' : 'text-red-400';
    return { texto, color };
  }

  // ---------- Estado ----------
  const TIPO_DOT = {
    'Visita':     'bg-blue-400',
    'Proveedor':  'bg-amber-400',
    'Empleado':   'bg-violet-400',
    'Paquetería': 'bg-rose-400',
  };

  // Estado real — se llena al cargar desde el backend (ver cargarActivos()).
  let vehiculosActivos = [];

  async function cargarActivos() {
    try {
      const resp = await fetch(`${API_BASE}/api/vehiculos-activos`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const datos = await resp.json();
      vehiculosActivos = datos.map(v => ({
        id: v.id, placa: v.placa, visitante: v.visitante, tipo: v.tipo,
        destino: v.destino, horaEntrada: parsearFechaUTC(v.hora_entrada),
      }));
      render();
    } catch (err) {
      mostrarToast(`No se pudo conectar con el servidor (${API_BASE})`, 'error');
    }
  }

  // ---------- Render ----------
  function render({ animarNuevo } = {}) {
    const lista = document.getElementById('vehicles-list');
    const vacio = document.getElementById('empty-state');
    const contador = document.getElementById('active-count');

    contador.textContent = vehiculosActivos.length;

    if (vehiculosActivos.length === 0) {
      lista.innerHTML = '';
      vacio.classList.remove('hidden');
      return;
    }
    vacio.classList.add('hidden');

    lista.innerHTML = vehiculosActivos.map(v => {
      const dot = TIPO_DOT[v.tipo] || 'bg-slate-400';
      const urgencia = calcularUrgencia(v.horaEntrada);
      const animar = animarNuevo === v.id ? 'animate-fade-in-up' : '';
      return `
        <div class="flex items-center gap-3 sm:gap-4 px-5 py-4 hover:bg-white/5 transition-colors ${animar}" data-row-id="${v.id}">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <span class="h-1.5 w-1.5 rounded-full ${dot} shrink-0"></span>
              <p class="font-mono font-bold text-[15px] text-white tracking-wider truncate">${escapeHtml(v.placa)}</p>
            </div>
            <p class="text-[13px] text-slate-400 mt-1 truncate pl-3.5">${escapeHtml(v.visitante || 'Sin nombre')} · ${escapeHtml(v.destino || 'Sin destino')}</p>
            <p data-elapsed="${v.id}" class="text-[11px] font-semibold mt-1 pl-3.5 ${urgencia.color}">${urgencia.texto}</p>
          </div>
          <button type="button" data-action="salida" data-id="${v.id}" aria-label="Marcar salida de ${escapeHtml(v.placa)}"
            class="shrink-0 h-12 px-4 sm:px-5 rounded-xl bg-red-600 hover:bg-red-700 active:scale-95 text-white text-sm font-bold shadow-sm shadow-red-600/20 transition-all">
            Marcar Salida
          </button>
        </div>`;
    }).join('');
  }

  // Actualiza solo el texto/color de "hace X min" sin reconstruir el DOM
  // (evita repetir la animación de entrada en cada refresco).
  function actualizarTiemposTranscurridos() {
    vehiculosActivos.forEach(v => {
      const el = document.querySelector(`[data-elapsed="${v.id}"]`);
      if (!el) return;
      const urgencia = calcularUrgencia(v.horaEntrada);
      el.textContent = urgencia.texto;
      el.className = `text-[11px] font-semibold mt-1 pl-3.5 ${urgencia.color}`;
    });
  }

  // ---------- Toasts ----------
  function mostrarToast(mensaje, tipo = 'success') {
    const estilos = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-slate-800' };
    const contenedor = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `pointer-events-auto ${estilos[tipo]} text-white text-sm font-semibold px-4 py-3.5 rounded-xl shadow-lg shadow-black/10 animate-toast-in`;
    toast.textContent = mensaje;
    contenedor.appendChild(toast);
    setTimeout(() => {
      toast.style.transition = 'opacity .3s ease, transform .3s ease';
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(8px)';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  function marcarCampoInvalido(id) {
    const el = document.getElementById(id);
    el.classList.add('border-red-400', 'ring-4', 'ring-red-500/10');
    setTimeout(() => el.classList.remove('border-red-400', 'ring-4', 'ring-red-500/10'), 1500);
  }

  // ---------- Formulario: Registrar Entrada ----------
  document.getElementById('entry-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const placa = document.getElementById('placa').value.trim();
    const visitante = document.getElementById('visitante').value.trim();
    const tipo = document.getElementById('tipo').value;
    const destino = document.getElementById('destino').value.trim();

    let valido = true;
    if (!placa) { marcarCampoInvalido('placa'); valido = false; }
    if (!tipo) { marcarCampoInvalido('tipo'); valido = false; }
    if (!valido) { mostrarToast('La placa y el motivo de visita son obligatorios', 'error'); return; }

    const boton = this.querySelector('button[type="submit"]');
    if (boton) boton.disabled = true;

    try {
      const resp = await fetch(`${API_BASE}/api/entradas`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ placa, visitante: visitante || null, tipo, destino: destino || null }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const guardado = await resp.json();
      const nuevoVehiculo = {
        id: guardado.id, placa: guardado.placa, visitante: guardado.visitante,
        tipo: guardado.tipo, destino: guardado.destino,
        horaEntrada: parsearFechaUTC(guardado.hora_entrada),
      };
      vehiculosActivos.unshift(nuevoVehiculo);
      render({ animarNuevo: nuevoVehiculo.id });
      this.reset();
      document.getElementById('placa').focus();
      mostrarToast(`Entrada registrada: ${placa}`, 'success');
    } catch (err) {
      mostrarToast('No se pudo guardar — revisa que el backend esté corriendo', 'error');
    } finally {
      if (boton) boton.disabled = false;
    }
  });

  document.getElementById('placa').addEventListener('input', function () {
    this.value = this.value.toUpperCase();
  });

  // ---------- Salida Express ----------
  document.getElementById('vehicles-list').addEventListener('click', async function (e) {
    const boton = e.target.closest('[data-action="salida"]');
    if (!boton) return;
    const id = boton.dataset.id;
    const vehiculo = vehiculosActivos.find(v => String(v.id) === String(id));
    if (!vehiculo) return;
    boton.disabled = true;

    try {
      const resp = await fetch(`${API_BASE}/api/salidas/${id}`, { method: 'PUT' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const fila = boton.closest('[data-row-id]');
      if (fila) {
        fila.style.transition = 'opacity .2s ease, transform .2s ease';
        fila.style.opacity = '0';
        fila.style.transform = 'scale(0.98)';
      }
      setTimeout(() => {
        vehiculosActivos = vehiculosActivos.filter(v => String(v.id) !== String(id));
        render();
        mostrarToast(`Salida registrada: ${vehiculo.placa}`, 'info');
      }, 180);
    } catch (err) {
      boton.disabled = false;
      mostrarToast('No se pudo registrar la salida — intenta de nuevo', 'error');
    }
  });

  // ---------- Reloj ----------
  function actualizarReloj() {
    const ahora = new Date();
    document.getElementById('clock-time').textContent = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    document.getElementById('clock-date').textContent = ahora.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  // ---------- Estado de conexión ----------
  function actualizarConexion() {
    const punto = document.getElementById('connection-dot');
    const texto = document.getElementById('connection-text');
    const enLinea = navigator.onLine;
    punto.className = `h-2 w-2 rounded-full ${enLinea ? 'bg-emerald-400 animate-pulse' : 'bg-red-400'}`;
    texto.textContent = enLinea ? 'En línea' : 'Sin conexión';
  }
  window.addEventListener('online', actualizarConexion);
  window.addEventListener('offline', actualizarConexion);

  // ---------- Inicialización ----------
  render();
  cargarActivos();
  actualizarReloj();
  actualizarConexion();
  setInterval(actualizarReloj, 1000);
  setInterval(actualizarTiemposTranscurridos, 30000);
</script>
</body>
</html>
